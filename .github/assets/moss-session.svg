<text class="m" x="304" y="154">X 0</text>
<text class="m" x="304" y="174">maxmatches 10</text>
<text class="m" x="304" y="194">show 250</text>
</g>
<text class="m a l-lang" x="304" y="214">language python</text>
<text class="m a l-f0" x="304" y="234">file 0 python 418 skeleton.py</text>
<text class="m a l-f1" x="304" y="254">file 1 python 1302 alice.py</text>
<text class="m a l-f2" x="304" y="274">file 2 python 1275 bob.py</text>
<text class="m a l-q" x="304" y="294">query 0</text>
<g class="a l-url">
