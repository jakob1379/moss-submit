<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 384" width="960" height="384" role="img" aria-labelledby="t d">
<title id="t">A moss submit session</title>
<desc id="d">Three local files, skeleton.py as base code plus alice.py and bob.py, are uploaded line by line over the MOSS protocol to moss.stanford.edu port 7690. The server replies with a report URL, and the report pairs alice.py with bob.py and highlights their matching code.</desc>
<style>
:root{--bg:#F3F5F9;--panel:#FFFFFF;--ink:#1D2433;--muted:#667089;--line:#D3D9E4;--bar:#C9D0DC;--accent:#2F5BD3;--m1:#E3A21A;--m2:#17A08C}
@media (prefers-color-scheme:dark){:root{--bg:#121826;--panel:#1A2233;--ink:#E5E9F1;--muted:#8E98AE;--line:#2D374B;--bar:#3A4559;--accent:#86A6FF;--m1:#F2B937;--m2:#3CC9B2}}
.bg{fill:var(--bg)}
.panel{fill:var(--panel);stroke:var(--line);stroke-width:1.5}
.base{stroke-dasharray:5 4}
.bar{fill:var(--bar)}
.guide{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:2 4;stroke-linecap:round}
.h{font:600 13px system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:var(--muted)}
.s{font:500 12px system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:var(--ink)}
.sm{font:500 11px system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:var(--muted)}
.m{font:12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:var(--ink)}
.fn{font:600 12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:var(--ink)}
.reply{fill:var(--accent)}
.m1{fill:var(--m1)}
.m2{fill:var(--m2)}
.pk{fill:var(--accent);opacity:0}
.a{animation-duration:12s;animation-iteration-count:infinite;animation-timing-function:ease-out}
.l-head{animation-name:l-head}.l-lang{animation-name:l-lang}.l-f0{animation-name:l-f0}.l-f1{animation-name:l-f1}.l-f2{animation-name:l-f2}.l-q{animation-name:l-q}.l-url{animation-name:l-url}.l-end{animation-name:l-end}.l-card{animation-name:l-card}
.pk0{animation-name:pk0;animation-timing-function:linear}.pk1{animation-name:pk1;animation-timing-function:linear}.pk2{animation-name:pk2;animation-timing-function:linear}.pkr{animation-name:pkr;animation-timing-function:linear}
.f1{animation-name:f1}.f2{animation-name:f2}
@keyframes l-head{0%,3.3%{opacity:0;transform:translateX(-6px)}6.7%,90%{opacity:1;transform:none}95%,100%{opacity:0}}
@keyframes l-lang{0%,10%{opacity:0;transform:translateX(-6px)}12.5%,90%{opacity:1;transform:none}95%,100%{opacity:0}}
@keyframes l-f0{0%,20%{opacity:0;transform:translateX(-6px)}22.5%,90%{opacity:1;transform:none}95%,100%{opacity:0}}
@keyframes l-f1{0%,30%{opacity:0;transform:translateX(-6px)}32.5%,90%{opacity:1;transform:none}95%,100%{opacity:0}}
@keyframes l-f2{0%,40%{opacity:0;transform:translateX(-6px)}42.5%,90%{opacity:1;transform:none}95%,100%{opacity:0}}
@keyframes l-q{0%,46.7%{opacity:0;transform:translateX(-6px)}49.2%,90%{opacity:1;transform:none}95%,100%{opacity:0}}
@keyframes l-url{0%,56.7%{opacity:0;transform:translateX(-6px)}59.2%,90%{opacity:1;transform:none}95%,100%{opacity:0}}
@keyframes l-end{0%,64%{opacity:0;transform:translateX(-6px)}66.7%,90%{opacity:1;transform:none}95%,100%{opacity:0}}
@keyframes l-card{0%,61%{opacity:0;transform:translateX(8px)}64.5%,90%{opacity:1;transform:none}95%,100%{opacity:0}}
@keyframes f1{0%,65%{fill:var(--bar)}69%,100%{fill:var(--m1)}}
@keyframes f2{0%,68%{fill:var(--bar)}72%,100%{fill:var(--m2)}}
@keyframes pk0{0%,15%{opacity:0;transform:none}15.2%{opacity:1;transform:none}16%{transform:translate(26px,0)}19.2%{transform:translate(26px,106px)}20%{opacity:1;transform:translate(48px,106px)}20.4%,100%{opacity:0;transform:translate(48px,106px)}}
@keyframes pk1{0%,25%{opacity:0;transform:none}25.2%{opacity:1;transform:none}26%{transform:translate(14px,0)}28.6%{transform:translate(14px,34px)}30%{opacity:1;transform:translate(48px,34px)}30.4%,100%{opacity:0;transform:translate(48px,34px)}}
@keyframes pk2{0%,35%{opacity:0;transform:none}35.2%{opacity:1;transform:none}36%{transform:translate(26px,0)}39%{transform:translate(26px,-38px)}40%{opacity:1;transform:translate(48px,-38px)}40.4%,100%{opacity:0;transform:translate(48px,-38px)}}
@keyframes pkr{0%,59.2%{opacity:0;transform:none}59.4%{opacity:1;transform:none}61%{opacity:1;transform:translate(32px,0)}61.4%,100%{opacity:0;transform:translate(32px,0)}}
@media (prefers-reduced-motion:reduce){.a{animation:none!important}.pk{display:none}}
</style>
<rect class="bg" width="960" height="384" rx="16"/>

